render:
  crf: 18
  preset: medium
  fps: first              # first = 统一取第1段帧率；或填数字如 30
  audio_rate: 44100
  leading_trim: true      # 首句前若有文案外的口播（如"兄弟们看个狠货"），音画同掐、字幕前移
  bgm: e:\work\tarecut\music.mp3   # 成片BGM音频路径；空=不加
  bgm_volume: 0.12        # BGM音量(线性0~1)：0.12≈-18dB，垫在人声下不喧宾夺主；嫌轻可加到0.2

audit:
  min_len: 1              # 报告至少影响几个字的差异
  ignore_same_pinyin: true  # 同音异字标记为低优先级(识别写法差异)
