# ==============================
# 批量自动化剪辑配置
# ==============================

asr:
  backend: dashscope      # dashscope(云端，推荐，无需下模型) / local(本地whisper)
  model: paraformer-v2    # dashscope 模型名；local 模型为 tiny/base/small/medium
  language: zh
  dashscope:
    api_key: ""           # 不要明文写在配置里；用环境变量 DASHSCOPE_API_KEY 传入
    base: https://dashscope.aliyuncs.com
  # ---- 以下用于本地 faster-whisper：云端转写兜底 + 对齐的真实词级时间戳 ----
  model_local: small      # tiny/base/small/medium/large-v3，中文建议 small+
  device: auto            # auto / cpu / cuda
  compute_type: auto      # auto / int8(cpu推荐) / float16(cuda推荐)
  hf_endpoint: https://hf-mirror.com   # 国内镜像加速模型下载；海外网络可留空

subtitle:
  fontname: Microsoft YaHei
  primary_colour: "&H0000FFFF"  # 字幕主色(ASS BGR)：黄色
  outline_colour: "&H00000000"  # 描边色：黑色
  font_size_ratio: 0.055  # 字号 = 视频高 * 该比例（1080p → 59px；原 0.045=49px）
  margin_v_ratio: 0.08    # 距底边高度比例
  outline: 3              # 描边宽度
  max_line_chars: 16      # 超过则按标点二次切分
  min_duration: 0.8       # 单条字幕最短显示秒数

tts:
  mode: patch             # patch=定点补丁(默认，口型完美) / full=全文配音(句级对齐，音色统一)
  engine: dashscope       # dashscope(CosyVoice云端，推荐) / edge-tts / command
  dashscope:
    api_key: ""           # 留空自动复用 asr.dashscope.api_key 或环境变量
    model: cosyvoice-v2
    voice: longcheng_v2   # 男声；备选 longshu_v2(播音腔)、longwan_v2(女声)
  voice: zh-CN-YunjianNeural   # edge-tts 音色
  rate: "+0%"
  max_native_speed: 1.6   # TTS 原生加速上限：句子超长到需更高压缩时放弃补丁保留原声（过度压缩又赶又假还溢出）
  pronunciation:        # 读音纠错表：只影响配音读音、字幕不变；发现新错读音继续往里加
    剐蹭: 寡蹭
    匹: 痞              # 匹配 → pǐ pèi（CosyVoice 常读成 pī）
    国VI: 国六          # 整体替换；须排在 国V 之前（代码已按键长优先，防被拆成"国五I"）
    国V: 国五           # 国V 整词读作"国五"；单独的字母 V 不受影响（键是两字，不匹配裸 V）
    KM: 千米            # 大小写各写法分别列，替换区分大小写（实测数据里有 430KM/71km/64.2kWh）
    km: 千米
    kWh: 千瓦时
    kwh: 千瓦时
  force_patch_words:    # 强制补丁词：原声易读错但 ASR 听不出（声调/多音字），命中即重念该句
    - 保险杠
    - 剐蹭
    - 含税            # 原声"含"被两家 ASR 都听成"欠/骗"（播音员读得不标准），TTS 读"含税"是准的
    - 车况报告        # 原声常见"报-报告"结巴，ASR 会自动抹平结巴听不出来，重念消除
  # engine=command 时执行该模板命令，占位符 {text} {out} {ref}
  # 示例(接本地音色克隆): python cosyvoice_infer.py --text {text} --ref {ref} --out {out}
  command: ""
  reference:              # 音色克隆参考音
    enabled: true         # dashscope 引擎：自动把参考音注册为克隆音色（缓存25天，失败回退官方音色）
    path: ""              # 参考音路径；空 = 自动取第1段音频开头人声
    start: 1.0            # 从参考音起点第几秒开始截取
    duration: 11.0        # 截取秒数（建议 10s 左右）

flaws:
  enabled: true
  style: fullscreen       # fullscreen=全屏模糊背景+等比居中大图(推荐) / card=左上角白边小卡
  blur_sigma: 20          # fullscreen 模糊强度
  width_ratio: 0.30       # card 模式: 瑕疵图宽 = 视频宽 * 比例
  x_side: left            # card 模式: left=画面左上 / right=右上
  x_margin_ratio: 0.04    # card 模式: 距侧边边距
  y_ratio: 0.28           # card 模式: 图片中心纵向位置(视频高比例)
  min_duration: 2.0       # 单图最短展示秒数
  fade: 0.25              # 淡入淡出秒数，0 为关闭
  border: 6               # 白边宽度(px)，0 为关闭
  synonyms:
